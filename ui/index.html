<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Duck-Tac-Toe</title>
<style>
  :root {
    --bg: #121418;
    --surface: #1a1e26;
    --border: rgba(255, 255, 255, 0.1);
    --text: #e8e6e0;
    --dim: #9a968c;
    --accent: #f5c451;
    --x: #7dd3fc;
    --o: #fbbf24;
    --win: #86efac;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    height: 100%;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); }
  #status {
    min-height: 1.4em;
    color: var(--dim);
    text-align: center;
  }
  #status.is-win { color: var(--win); font-weight: 600; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    grid-template-rows: repeat(3, 72px);
    gap: 6px;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.08s ease;
  }
  .cell:hover:not(:disabled) {
    background: rgba(245, 196, 81, 0.12);
    transform: translateY(-1px);
  }
  .cell:disabled { cursor: default; opacity: 0.95; }
  .cell.is-x { color: var(--x); }
  .cell.is-o { color: var(--o); }
  .cell.is-open { color: transparent; }
  #actions { display: flex; gap: 8px; }
  button.btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    font: inherit;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  #hint {
    max-width: 280px;
    text-align: center;
    color: var(--dim);
    font-size: 11px;
  }
  #err { color: #f87171; min-height: 1.2em; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <h1>Duck-<span>Tac</span>-Toe</h1>
  <div id="status">Loading…</div>
  <div id="board" aria-label="Tic-tac-toe board"></div>
  <div id="actions">
    <button type="button" class="btn" id="newGame">New game</button>
  </div>
  <div id="hint">Board lives in this chat (collapse with the toggle). Clicks ping Ducky — including wins. New game resets + pings.</div>
  <div id="err"></div>
</div>
<script>
const CHANNEL = "uefn-plugin-ui";
const CACHE_KEY = "state";
const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6],
];

function call(method, params = {}) {
  const id = crypto.randomUUID();
  return new Promise((resolve, reject) => {
    function onMsg(ev) {
      const d = ev.data;
      if (!d || d.channel !== CHANNEL || d.id !== id) return;
      window.removeEventListener("message", onMsg);
      if (d.ok) resolve(d.result);
      else reject(new Error(d.error || "bridge error"));
    }
    window.addEventListener("message", onMsg);
    parent.postMessage({ channel: CHANNEL, id, method, params }, "*");
  });
}

function emptyBoard() { return ["", "", "", "", "", "", "", "", ""]; }

function winnerOf(board) {
  for (const [a, b, c] of WIN_LINES) {
    if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
  }
  if (board.every(Boolean)) return "draw";
  return null;
}

function newState(agentMarker = "O") {
  const am = agentMarker === "X" ? "X" : "O";
  return {
    board: emptyBoard(),
    turn: "X",
    human_marker: am === "O" ? "X" : "O",
    agent_marker: am,
    winner: null,
    status: "playing",
    move_count: 0,
    updated_at: Date.now() / 1000,
  };
}

function normalizeState(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.board)) return newState();
  const board = emptyBoard().map((_, i) => String(raw.board[i] || ""));
  return {
    board,
    turn: raw.turn === "O" ? "O" : "X",
    human_marker: raw.human_marker === "O" ? "O" : "X",
    agent_marker: raw.agent_marker === "X" ? "X" : "O",
    winner: raw.winner || null,
    status: raw.status === "over" ? "over" : "playing",
    move_count: Number(raw.move_count) || 0,
    updated_at: Number(raw.updated_at) || Date.now() / 1000,
  };
}

async function loadState() {
  const res = await call("cache.get", { key: CACHE_KEY });
  const data = res && res.data && typeof res.data === "object" ? res.data : {};
  return normalizeState(data);
}

async function saveState(state) {
  await call("cache.set", { key: CACHE_KEY, data: state });
}

function applyMove(state, cell, marker) {
  if (state.status !== "playing") throw new Error("game over");
  if (marker !== state.turn) throw new Error("not your turn");
  if (cell < 0 || cell > 8) throw new Error("bad cell");
  if (state.board[cell]) throw new Error("occupied");
  const board = state.board.slice();
  board[cell] = marker;
  const w = winnerOf(board);
  return {
    ...state,
    board,
    turn: w ? state.turn : (state.turn === "X" ? "O" : "X"),
    winner: w,
    status: w ? "over" : "playing",
    move_count: (state.move_count || 0) + 1,
    updated_at: Date.now() / 1000,
  };
}

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const errEl = document.getElementById("err");
let state = newState();
let busy = false;

function render() {
  boardEl.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const v = state.board[i] || "";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cell" + (v === "X" ? " is-x" : v === "O" ? " is-o" : " is-open");
    btn.textContent = v; // empty cells stay blank (no placeholder glyph)
    const humanTurn =
      state.status === "playing" &&
      state.turn === state.human_marker &&
      !v;
    btn.disabled = !humanTurn || busy;
    btn.addEventListener("click", () => void onCell(i));
    boardEl.appendChild(btn);
  }
  statusEl.classList.toggle("is-win", Boolean(state.winner));
  if (state.winner === "draw") {
    statusEl.textContent = "Draw — rematch?";
  } else if (state.winner) {
    const who = state.winner === state.human_marker ? "You" : "Ducky";
    statusEl.textContent = `${who} win${who === "You" ? "" : "s"}! (${state.winner})`;
  } else if (state.turn === state.human_marker) {
    statusEl.textContent = `Your turn (${state.human_marker})`;
  } else {
    statusEl.textContent = `Ducky's turn (${state.agent_marker})…`;
  }
}

async function onCell(i) {
  if (busy) return;
  errEl.textContent = "";
  busy = true;
  try {
    const next = applyMove(state, i, state.human_marker);
    await saveState(next);
    state = next;
    render();
    // Always ping — including wins/draws. (Old bug: only pinged while status===playing,
    // so a human win was silent and chat guessed UEFN "victory" instead.)
    parent.postMessage(
      { channel: CHANNEL, event: "ducktactoe.human_move", cell: i, state },
      "*",
    );
  } catch (e) {
    errEl.textContent = e instanceof Error ? e.message : String(e);
  } finally {
    busy = false;
    render();
  }
}

document.getElementById("newGame").addEventListener("click", async () => {
  errEl.textContent = "";
  busy = true;
  render(); // disable cells while resetting
  try {
    state = newState(state.agent_marker || "O");
    await saveState(state);
    // Tell the host chat dock to ping the agent (shared cache alone is silent).
    parent.postMessage(
      { channel: CHANNEL, event: "ducktactoe.new_game", state },
      "*",
    );
  } catch (e) {
    errEl.textContent = e instanceof Error ? e.message : String(e);
  } finally {
    // Must re-render after busy=false — otherwise cells stay disabled forever
    // (poll skips when board already matches the reset state).
    busy = false;
    render();
  }
});

async function poll() {
  try {
    const next = await loadState();
    // Don't clobber a mid-click write with a stale poll.
    if (!busy) {
      const same =
        JSON.stringify(next.board) === JSON.stringify(state.board) &&
        next.turn === state.turn &&
        next.winner === state.winner &&
        next.status === state.status;
      if (!same) {
        state = next;
        render();
      }
    }
  } catch (e) {
    errEl.textContent = e instanceof Error ? e.message : String(e);
  }
}

(async () => {
  try {
    state = await loadState();
    // First open with empty cache: persist a fresh board so the agent sees it.
    if (!(await call("cache.get", { key: CACHE_KEY })).data?.board) {
      await saveState(state);
    }
  } catch (e) {
    errEl.textContent = e instanceof Error ? e.message : String(e);
    state = newState();
  }
  render();
  setInterval(() => void poll(), 300);
})();
</script>
</body>
</html>
